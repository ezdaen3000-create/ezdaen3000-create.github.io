<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>موقع عزالدين الشخصي</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #080d1a, #172b4d);
        color: white;
        text-align: center;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 85%;
        max-width: 500px;
        padding: 30px 20px;
        border: 1px solid #00d9ff;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 0 25px rgba(0, 217, 255, 0.2);
    }

    h1 {
        color: #00d9ff;
        font-size: 32px;
    }

    p {
        line-height: 1.9;
        font-size: 18px;
    }

    .button {
        display: inline-block;
        padding: 12px 24px;
        background: #00d9ff;
        color: #08111f;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        margin-top: 12px;
    }

    footer {
        margin-top: 25px;
        color: #b8c7dc;
        font-size: 14px;
    }
</style>

</head><body><div class="card">
    <h1>مرحبًا بكم 👋</h1>

    <h2>أنا عزالدين</h2>

    <p>
        أهلاً بك في موقعي الشخصي.
        <br>
        أحب البرمجة والتكنولوجيا وصناعة الألعاب.
        <br>
        أتعلم بايثون وأسعى إلى تطوير مشروعات إبداعية.
    </p>

    <a class="button"
       href="https://github.com/"
       target="_blank"
       rel="noopener noreferrer">
        اكتشف عالم البرمجة
    </a>

    <footer>
        © 2026 — الموقع الشخصي لعزالدين
    </footer>
</div>

</body>
</html>
